[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "empyre"
dynamic = ["version"]
description = "Turn-based strategy game built upon bbsengine6"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "GPL-2.0-or-later"
authors = [
    { name = "zoidtechnologies.com", email = "empyre@projects.zoidtechnologies.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: BBS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "bbsengine6",
    "importlib-metadata; python_version >= '3.13'",
    "psycopg",
    "psycopg-pool",
    "python-dateutil",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
empyre = "empyre.__main__:main"

[project.urls]
Homepage = "https://repo.zoidtechnologies.com/empyre/"

[tool.setuptools.packages.find]
where = ["."]
include = ["empyre*"]

[tool.setuptools.dynamic]
version = { attr = "empyre._version.__version__" }

[tool.setuptools.package-data]
empyre = ["data/*.txt", "data/quests/*.txt", "sql/*.sql", "sql/Makefile"]
